# =====================================================================
#  JOB AGENT v7 – Damir Hadžić  ·  ONE file  ·  checks every 5 minutes
#  Your job list appears on the front page of this repository.
#  The only thing you edit: the FEEDS list below.
#  One link per line, under the "Paste" line, starting at the same position.
# =====================================================================

name: Job search

env:
  FEEDS: |
        # Paste each new link on its own line under this one:
        https://www.google.com/alerts/feeds/07122033372245260923/2138066189446356004
        https://reliefweb.int/jobs/rss.xml?search=construction
        https://reliefweb.int/jobs/rss.xml?search=infrastructure
        https://reliefweb.int/jobs/rss.xml?search=shelter

# ---------------- nothing to edit below this line ----------------

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Search
        run: |
          python3 - <<'PY'
          import html, json, os, re, sys, urllib.request, xml.etree.ElementTree as ET
          from datetime import date
          from pathlib import Path

          FEEDS = [l.strip().strip("'\",").strip() for l in os.environ.get("FEEDS", "").splitlines()]
          FEEDS = [l for l in FEEDS if l.startswith(("http", "test:"))]
          GOOD = {"construction": 4, "infrastructure": 4, "reconstruction": 4, "architect": 4, "engineer": 3,
                  "rehabilitation": 3, "shelter": 3, "housing": 3, "heritage": 3, "project manager": 3,
                  "programme manager": 3, "contract management": 3, "civil": 2, "building": 2, "urban": 2,
                  "wash": 2, "fidic": 2, "site supervision": 2, "bosnia": 4, "sarajevo": 4, "balkans": 2}
          SKIP_TITLE = ["intern", "internship", "driver", "software", "nurse", "accountant"]
          SKIP_TEXT = ["nationals of", "open to nationals", "national consultant", "locally recruited",
                       "npsa", "national professional officer", "national un volunteer"]
          STARTER = [
              ["Senior Programme Manager – National Housing Support Programme", "UNOPS · Damascus · IICA-3", "https://careers.unops.org/careersmarketplace/JobDetail/Senior-Programme-Manager/4692", "2026-10-30", "High"],
              ["Programme Management Specialist – UN-Habitat Syria", "UNOPS · Homs · IICA-2", "https://unvacancies.org/jobs/organization/unops", "2026-10-30", "High"],
              ["Contract Management Specialist", "UNOPS · Home-based · check eligibility", "https://careers.unops.org/", "2026-10-14", "Medium"],
              ["ETC Construction Coordinator (5 positions)", "CTG · DR Congo", "https://app.tayohr.io/jobs/detail/vac-74481-etc-construction-coordinator-73167", "2026-10-10", "High"],
              ["International Urban Design Lead Expert", "UN-Habitat · Remote / Baku", "https://unvacancies.org/jobs/organization/un-habitat", "2026-10-14", "Medium"],
              ["Gaza Coordinator", "UNOPS · Gaza · P-4", "https://unvacancies.org/jobs/organization/unops#gaza", "2026-10-18", "Medium"],
              ["Architect / Civil Engineer – Existing Buildings (Req 3412)", "STRABAG · Austria", "https://jobboerse.strabag.at/job-detail.php?ReqId=3412&language=AT_EN", "", "High"],
              ["Shelter and Settlement Coordinator", "Danish Refugee Council · Beirut", "https://unjobs.org/skills/infrastructure-projects", "", "High"],
              ["Head of Building & IT Infrastructure Department", "Council of Europe · Strasbourg", "https://talents.coe.int/en_GB/careersmarketplace/JobDetail/Head-of-Building-and-IT-Infrastructure-Department/1565", "", "Medium"],
              ["Program Director for Europe", "Habitat for Humanity · Bratislava", "https://habitat.wd12.myworkdayjobs.com/External/job/Bratislava-Slovakia/Program-Director-for-Europe_JR103615-1", "", "Medium"],
              ["Construction Project Manager – 12-month FTC", "Lidl · Dublin", "https://jobs.lidl.ie/jobs/construction-project-manager-12-month-fixed-term-dublin-24-755402", "", "Medium"],
              ["Consultant – Field Engineer (STRONG)", "IOM · Banjul", "https://unjobs.org/skills/infrastructure-projects#iom", "", "Medium"],
          ]
          TODAY = date.today()
          MON = {m: i for i, m in enumerate("jan feb mar apr may jun jul aug sep oct nov dec".split(), 1)}

          def has(w, t): return re.search(r"(?<![a-z0-9])" + re.escape(w) + r"(?![a-z0-9])", t) is not None
          def points(ti, tx): t = (ti + " " + tx).lower(); return sum(p for w, p in GOOD.items() if has(w, t))
          def skip(ti, tx):
              t = (ti + " " + tx).lower()
              return any(has(w, ti.lower()) for w in SKIP_TITLE) or (any(has(w, t) for w in SKIP_TEXT) and not has("bosnia", t))
          def deadline(text):
              t, lead = text.lower(), r"(?:closing date|deadline|apply by|closes)\W{0,6}"
              m = re.search(lead + r"(\d{1,2})\s*([a-z]{3})[a-z]*\.?,?\s*(20\d\d)", t)
              if m and m[2] in MON: return f"{m[3]}-{MON[m[2]]:02d}-{int(m[1]):02d}"
              m = re.search(lead + r"([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s*(20\d\d)", t)
              if m and m[1] in MON: return f"{m[3]}-{MON[m[1]]:02d}-{int(m[2]):02d}"
              m = re.search(lead + r"(20\d\d)-(\d\d)-(\d\d)", t)
              return f"{m[1]}-{m[2]}-{m[3]}" if m else ""
          def clean(s): return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", s or ""))).strip()
          def same(l): return re.sub(r"^https?://(www\.)?", "", (l or "").split("?")[0].split("#")[0].rstrip("/").lower())
          def md(s): return re.sub(r"([\[\]|*_`<>])", r"\\\1", s or "")

          def read(url):
              raw = (Path(url[5:]).read_bytes() if url.startswith("test:") else
                     urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=15).read())
              if raw.lstrip()[:15].lower().startswith((b"<!doctype", b"<html")): raise ValueError("web page, not an RSS feed")
              root, A = ET.fromstring(raw), "{http://www.w3.org/2005/Atom}"
              for it in root.iter("item"):
                  yield clean(it.findtext("title")), (it.findtext("link") or "").strip(), clean(it.findtext("description"))
              for it in root.iter(A + "entry"):
                  el = it.find(A + "link"); link = el.get("href", "") if el is not None else ""
                  m = re.search(r"[?&]url=([^&]+)", link)
                  yield clean(it.findtext(A + "title")), urllib.request.unquote(m[1]) if m else link, clean(it.findtext(A + "content"))

          ok = (skip("Civil Engineer", "Open to nationals of Iraq") and not skip("Expert", "International consultant")
                and not skip("Engineer", "nationals of Bosnia and Herzegovina") and points("Assistant", "Washington") == 0
                and deadline("Closing date: 30 Oct 2026") == "2026-10-30" and deadline("Deadline: October 30, 2026") == "2026-10-30")
          if not ok: sys.exit("STOP: self-check failed. Send this log to Copilot.")

          file = Path("jobs.json")
          jobs = (json.loads(file.read_text(encoding="utf-8")) if file.exists() else
                  [dict(title=a, info=b, link=c, deadline=d, fit=e, found="2026-10-05") for a, b, c, d, e in STARTER])
          seen, new, log = {same(j["link"]) for j in jobs}, [], []
          for url in FEEDS:
              short = url.split("//")[-1][:55]
              try: items = list(read(url))
              except Exception as e: log.append(f"FAILED  {short}  ({e})"); continue
              n = 0
              for ti, link, tx in items:
                  if not ti or same(link) in seen: continue
                  seen.add(same(link)); p, d = points(ti, tx), deadline(tx)
                  if skip(ti, tx) or p < 4 or (d and d < TODAY.isoformat()): continue
                  new.append(dict(title=ti, info="", link=link, deadline=d, fit="High" if p >= 9 else "Medium" if p >= 6 else "Low", found=TODAY.isoformat())); n += 1
              log.append(f"OK      {short}  ({len(items)} read, {n} new)")
          jobs = new + jobs
          working = sum(l.startswith("OK") for l in log)
          log.append(f"\n{len(new)} new jobs. {len(jobs)} in total. Feeds working: {working} of {len(FEEDS)}.")
          if not working: log.append("No feed worked: add a Google Alerts RSS link at the top of the workflow file.")
          file.write_text(json.dumps(jobs, ensure_ascii=False, indent=1), encoding="utf-8")

          # ---- README = the job list shown on the repository's front page (changes only when jobs or days-left change) ----
          def days(j): return (date.fromisoformat(j["deadline"]) - TODAY).days if j["deadline"] else None
          FIT = {"High": "🟢 High", "Medium": "🟡 Medium", "Low": "⚪ Low"}
          def row(j):
              d = days(j)
              left = "check" if d is None else ("🔴 " if d <= 7 else "") + f"{d} days"
              newtag = " 🆕" if (TODAY - date.fromisoformat(j["found"])).days <= 2 else ""
              return f"| [{md(j['title'])}]({j['link'].replace(' ', '%20').replace(')', '%29')}){newtag} | {md(j['info'])} | {j['deadline'] or '–'} | {left} | {FIT.get(j['fit'], j['fit'])} |"
          open_ = sorted([j for j in jobs if days(j) is None or days(j) >= 0], key=lambda j: (days(j) is None, days(j) or 0))
          closed = [j for j in jobs if days(j) is not None and days(j) < 0]
          H = "| Job | Employer · place | Deadline | Left | Fit |\n|---|---|---|---|---|\n"
          out = [f"# My jobs – Damir Hadžić\n",
                 f"**{len(open_)} open jobs** · checked automatically every 5 minutes · last new job found: "
                 f"{max(j['found'] for j in jobs)}\n",
                 "🆕 = found in the last 2 days · 🔴 = 7 days or less left\n", H + "\n".join(row(j) for j in open_) + "\n"]
          if closed:
              out.append(f"<details><summary>Closed ({len(closed)})</summary>\n\n" + H + "\n".join(row(j) for j in closed) + "\n\n</details>\n")
          Path("README.md").write_text("\n".join(out), encoding="utf-8")
          print("\n".join(log))
          PY

      - name: Save
        run: |
          git config user.name "job-agent"
          git config user.email "job-agent@users.noreply.github.com"
          git add jobs.json README.md
          git diff --cached --quiet && echo "Nothing changed." && exit 0
          git commit -m "Jobs $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
